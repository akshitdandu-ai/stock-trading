name: Backtest

# Run by hand after the first data load, then it refreshes weekly (Sunday 10:00 IST).
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m backtest.run
